name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          xcodebuild test \
            -project UseBy.xcodeproj \
            -scheme UseBy \
            -destination 'platform=iOS Simulator,id=F5450765-59B9-4D0C-9B64-845B8C9EE51F' \
            -only-testing:UseByTests \
            CODE_SIGNING_ALLOWED=NO
