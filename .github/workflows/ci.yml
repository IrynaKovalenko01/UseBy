name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m 1 'iPhone' | sed -E 's/.*\(([^()]*)\) \(.*\)/\1/')

          xcodebuild test \
            -project UseBy.xcodeproj \
            -scheme UseBy \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -only-testing:UseByTests \
            CODE_SIGNING_ALLOWED=NO
